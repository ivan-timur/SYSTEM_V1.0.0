plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cronus.system'
    compileSdk 36

    signingConfigs {
        release {
            def signingStore = System.getenv('ANDROID_KEYSTORE_FILE')
            if (signingStore != null && !signingStore.trim().isEmpty()) {
                storeFile file(signingStore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.cronus.system'
        minSdk 24
        targetSdk 35
        versionCode 10000000
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.17.0'
}
